# ============================================================
# CI pipeline — backend tests, frontend build, secret scan,
# compose validation.
#
# The deploy step is an explicit MANUAL placeholder: no automatic
# deployment is attempted here, no accounts are created, and nothing
# is pushed anywhere. Production deployment is documented in
# docs/DEPLOYMENT_GUIDE.md and performed by a human operator.
# ============================================================
name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  backend-test:
    name: Backend tests (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies (FFmpeg)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        # Run from the repo root with `python -m pytest` so the repo root is
        # on sys.path and `backend.*` imports resolve (bare `pytest` from
        # backend/ fails with ModuleNotFoundError: No module named 'backend').
        working-directory: .
        run: python -m pytest backend/tests -q
        env:
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/1
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

  frontend-build:
    name: Frontend build (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com
          NEXT_PUBLIC_SUPABASE_URL: https://xxxxxxxxxxxx.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-for-ci-build-only

  secret-scan:
    name: Secret scan (no real credentials in repo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for key-like strings outside .env.example
        run: |
          # Fail if anything that looks like a real secret appears anywhere
          # except .env.example (which holds obviously-fake PLACEHOLDERS).
          # Lines containing PLACEHOLDER are exempt.
          set -o pipefail
          hits=$(grep -rEn \
              --exclude-dir=node_modules \
              --exclude-dir=.git \
              --exclude-dir=venv \
              --exclude-dir=__pycache__ \
              --exclude='*.map' \
              -e 'AIza[0-9A-Za-z_-]{20,}' \
              -e 'gsk_[A-Za-z0-9]{20,}' \
              -e 'sk-or-v1-[A-Za-z0-9]{10,}' \
              -e 'hf_[A-Za-z0-9]{10,}' \
              -e 'AKIA[0-9A-Z]{16}' \
              -e '-----BEGIN [A-Z ]*PRIVATE KEY-----' \
              -e 'xox[baprs]-[A-Za-z0-9-]{10,}' \
              . \
            | grep -v '^\./\.env\.example' \
            | grep -v 'PLACEHOLDER' \
            || true)
          if [ -n "$hits" ]; then
            echo "::error::Possible real secrets found in the repository:"
            echo "$hits"
            exit 1
          fi
          echo "secret scan clean — no key-like strings outside .env.example"

  compose-validate:
    name: Validate docker-compose.yml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: |
          # .env is git-ignored and absent in CI, but docker-compose.yml
          # declares env_file: .env — create an empty one so `config`
          # can validate the file without real secrets.
          touch .env
          if command -v docker >/dev/null 2>&1; then
            docker compose config --quiet && echo "docker compose config OK"
          else
            python3 -c "import yaml,sys; yaml.safe_load(open('docker-compose.yml')); print('yaml parse OK')"
          fi

  deploy:
    name: Deploy (MANUAL PLACEHOLDER)
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build, secret-scan, compose-validate]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Manual deployment required
        run: |
          echo "============================================================"
          echo " DEPLOY STEP IS MANUAL — nothing is deployed automatically."
          echo " Follow docs/DEPLOYMENT_GUIDE.md:"
          echo "   1. Cloudflare Pages   -> frontend (Next.js build)"
          echo "   2. Hugging Face Space -> backend (FastAPI, docker)"
          echo "   3. Supabase           -> database + auth + storage"
          echo "   4. Cloudflare R2      -> storage buckets"
          echo " A human operator performs these steps with their own"
          echo " cloud accounts and secrets. This job intentionally exits 0."
          echo "============================================================"
